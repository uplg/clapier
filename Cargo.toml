[workspace]
resolver = "3"
# vendor/pocket-tts is its own Cargo workspace (the Kyutai Pocket TTS
# Rust port); it is built on its own, not absorbed here.
exclude = ["vendor/pocket-tts"]
members = [
    "crates/clapier",
    "crates/clapier-chor",
    "crates/clapier-flash",
    "crates/clapier-fleet",
    "crates/clapier-journal",
    "crates/clapier-pages",
    "crates/clapier-vl",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/uplg/clapier"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
http = "1"
percent-encoding = "2"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "io-util", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clapier-chor = { path = "crates/clapier-chor" }
clapier-fleet = { path = "crates/clapier-fleet" }
clapier-journal = { path = "crates/clapier-journal" }
clapier-pages = { path = "crates/clapier-pages" }
clapier-vl = { path = "crates/clapier-vl" }

[profile.release]
lto = true
